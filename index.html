<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRJNP-HUB</title>
    <!-- โหลด Supabase Client จาก CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 { color: #38bdf8; text-align: center; }
        .card {
            background: #334155;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>

    <div class="container">
        <h1>KRJNP-HUB 🚀</h1>
        <p style="text-align: center; color: #94a3b8;">ระบบเชื่อมต่อฐานข้อมูล Supabase สำเร็จแล้ว!</p>
        
        <div class="card">
            <h3>สถานะการเชื่อมต่อ:</h3>
            <p id="status" style="color: #fbbf24;">กำลังตรวจสอบการเชื่อมต่อ...</p>
        </div>

        <div class="card">
            <h3>รายการสินค้าจาก Cloud Database:</h3>
            <div id="product-list">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <script>
        // กำหนดค่า Supabase URL และ Publishable Key ของเพื่อน
        const SUPABASE_URL = 'https://oluggvmmomjcbklypbdx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_jnhSzmkiX6HCTzZrCNSMaQ_ZvpuYUH6';

        // สร้าง Supabase Client
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkConnection() {
            const statusEl = document.getElementById('status');
            const productListEl = document.getElementById('product-list');

            try {
                // ดึงข้อมูลจากตาราง products
                const { data, error } = await _supabase.from('products').select('*');

                if (error) {
                    throw error;
                }

                statusEl.innerHTML = '✅ เชื่อมต่อกับ Supabase สำเร็จเรียบร้อย!';
                statusEl.style.color = '#4ade80';

                if (data.length === 0) {
                    productListEl.innerHTML = '<p>ยังไม่มีสินค้าในระบบ (สามารถเพิ่มข้อมูลใน Supabase Table Editor ได้เลย)</p>';
                } else {
                    let html = '<ul>';
                    data.forEach(product => {
                        html += `<li><b>${product.name}</b> - ราคา: ${product.price} บาท</li>`;
                    });
                    html += '</ul>';
                    productListEl.innerHTML = html;
                }

            } catch (err) {
                statusEl.innerHTML = '❌ เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + err.message;
                statusEl.style.color = '#f87171';
                productListEl.innerHTML = '';
            }
        }

        // รันฟังก์ชันตรวจสอบเมื่อโหลดหน้าเว็บ
        checkConnection();
    </script>
</body>
</html>
